name: Node 20
on:
  push:
    branches: [main, cx-m/K-03-sahte-seed, cx-m/K-04-check]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Kilit dosyasini dogrula
        run: node -e "console.log('LOCK_JSON=' + JSON.stringify(require('./package-lock.json')))"
      - run: npm test
      - run: node araclar/seedTesti.js
